<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealer Console Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--page:#F5F5F4;--ink:#151515;--bar:#FBE6C8;--bar-ink:#6B3600;color-scheme:light}
html,body{margin:0;background:var(--page);color:var(--ink)}
a{color:#1F1F1F}a:hover{color:#1A1A1A}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #3D62A8;outline-offset:2px}
#demo-bar{padding:8px 16px;background:var(--bar);color:var(--bar-ink);font:500 14px/1.4 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;text-align:center}
#app>div>div,#app>div>sc-none{min-height:calc(100vh - 36px)}
</style>
</head>
<body>
<div id="demo-bar">Prototype demo · sample data · not a live system</div>
<div id="app"></div>
<template id="tpl">

<div>
<sc-if value="{{isLogin}}" hint-placeholder-val="{{true}}">
<div style="min-height: 980px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 24px; background: #121212; color: #151515; font-size: 15px; line-height: 1.45; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif">
<div style="width: 100%; max-width: 420px; box-sizing: border-box; background: #FFFFFF; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 16px">
<div><div style="font-family: 'Archivo', 'Segoe UI', sans-serif; font-weight: 700; font-size: 20px">Canadian Fine Motors</div><div style="font-size: 13px; color: #555555">Owner console</div></div>
<h1 style="margin: 0; font-family: 'Archivo', 'Segoe UI', sans-serif; font-weight: 700; font-size: 26px">Sign in</h1>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Email<input type="email" autocomplete="username" placeholder="name@example.com" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 10px 12px; border: 1px solid #8A8A88; border-radius: 8px; font-family: inherit; font-size: 16px; color: #151515; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Password<input type="password" autocomplete="current-password" placeholder="Password" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 10px 12px; border: 1px solid #8A8A88; border-radius: 8px; font-family: inherit; font-size: 16px; color: #151515; background: #FFFFFF"></label>
<button onClick="{{signIn}}" style="min-height: 44px; padding: 10px 16px; border: 0; border-radius: 8px; background: #1F1F1F; color: #FFFFFF; font-size: 15px; font-weight: 600">Sign in</button>
<div style="font-size: 13px; color: #555555">Demo sign-in. Any details are accepted, then a verification code is requested. Do not enter a real password.</div>
</div>
</div>
</sc-if>
<sc-if value="{{isMfa}}" hint-placeholder-val="{{false}}">
<div style="min-height: 980px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 24px; background: #121212; color: #151515; font-size: 15px; line-height: 1.45; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif">
<div style="width: 100%; max-width: 420px; box-sizing: border-box; background: #FFFFFF; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 16px">
<div><div style="font-family: 'Archivo', 'Segoe UI', sans-serif; font-weight: 700; font-size: 20px">Canadian Fine Motors</div><div style="font-size: 13px; color: #555555">Two-step verification</div></div>
<h1 style="margin: 0; font-family: 'Archivo', 'Segoe UI', sans-serif; font-weight: 700; font-size: 26px">Enter your code</h1>
<div style="font-size: 14px">Open your authenticator app and enter the 6-digit code for this account.</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Verification code<input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 10px 12px; border: 1px solid #8A8A88; border-radius: 8px; font-family: inherit; font-size: 16px; color: #151515; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.3em"></label>
<button onClick="{{verify}}" style="min-height: 44px; padding: 10px 16px; border: 0; border-radius: 8px; background: #1F1F1F; color: #FFFFFF; font-size: 15px; font-weight: 600">Verify and continue</button>
<button onClick="{{backToLogin}}" style="min-height: 44px; padding: 10px 16px; border: 1px solid #1F1F1F; border-radius: 8px; background: #FFFFFF; color: #1A1A1A; font-size: 15px; font-weight: 500">Back to sign in</button>
<div style="font-size: 13px; color: #555555">Demo step. Any code is accepted. The real system would also offer SMS codes and recovery codes.</div>
</div>
</div>
</sc-if>
<sc-if value="{{isIn}}" hint-placeholder-val="{{false}}">
<div style="min-height: 980px; display: flex; flex-wrap: wrap; align-items: stretch; background: #F5F5F4; color: #151515; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45">

<nav aria-label="Modules" style="flex: 1 1 220px; box-sizing: border-box; background: #121212; color: #F2F2F2; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 8px">
<div style="font-family: 'Archivo', 'Segoe UI', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.01em">Canadian Fine Motors</div>
<div style="font-size: 13px; color: #B8B8B8">Owner console · Scarborough, ON</div>
</div>
<sc-for list="{{navGroups}}" as="g" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="padding: 0 8px; font-size: 13px; font-weight: 600; color: #B8B8B8">{{g.title}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
<button onClick="{{n.go}}" style="flex: 1 1 170px; min-height: 44px; text-align: left; padding: 10px 14px; border: 0; border-radius: 8px; font-size: 15px; font-weight: 500; background: {{n.bg}}; color: {{n.fg}}">{{n.label}}</button>
</sc-for>
</div>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="padding: 0 8px; font-size: 13px; color: #B8B8B8">Signed in as Owner · two-step verification on</div>
<button onClick="{{goNotif}}" style="min-height: 44px; text-align: left; padding: 10px 14px; border: 1px solid #4A4A4A; border-radius: 8px; font-size: 15px; font-weight: 500; background: {{notifBg}}; color: {{notifFg}}">{{notifBtnLabel}}</button>
<button onClick="{{logout}}" style="min-height: 44px; text-align: left; padding: 10px 14px; border: 1px solid #4A4A4A; border-radius: 8px; font-size: 15px; font-weight: 500; background: #121212; color: #F2F2F2">Sign out</button>
</div>
<div style="margin: 0 8px; padding: 10px 12px; border: 1px solid #4A4A4A; border-radius: 8px; font-size: 13px; color: #D4D4D4">Prototype with sample data. Figures are illustrative.</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px">
<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 16px; background: #151515; color: #FFFFFF; border-radius: 8px">
<span>{{toast}}</span>
<button onClick="{{clearToast}}" style="min-height: 44px; padding: 8px 14px; border: 1px solid #FFFFFF; border-radius: 8px; background: #151515; color: #FFFFFF; font-size: 14px">Dismiss</button>
</div>
</sc-if>
<sc-if value="{{formView.open}}" hint-placeholder-val="{{false}}">
<div style="position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px; box-sizing: border-box; overflow-y: auto; background: rgba(0, 0, 0, 0.55)">
<div role="dialog" aria-modal="true" aria-label="{{formView.title}}" style="width: 100%; max-width: 660px; box-sizing: border-box; background: #FFFFFF; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: 'Archivo', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 700">{{formView.title}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
<sc-for list="{{formView.fields}}" as="f" hint-placeholder-count="6">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500"><span>{{f.label}}</span><input type="text" value="{{f.value}}" onChange="{{f.change}}" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 10px 12px; border: 1px solid #8A8A88; border-radius: 8px; font-family: inherit; font-size: 16px; color: #151515; background: #FFFFFF"></label>
</sc-for>
</div>
<sc-if value="{{formView.showKinds}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; font-weight: 500">Status type</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{formView.kindBtns}}" as="k" hint-placeholder-count="4">
<button onClick="{{k.pick}}" style="min-height: 44px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; border: 2px solid {{k.border}}; background: {{k.bg}}; color: {{k.fg}}">{{k.label}}</button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{formView.hasError}}" hint-placeholder-val="{{false}}">
<div role="alert" style="padding: 10px 12px; border-radius: 8px; background: #FBE6C8; color: #6B3600; font-weight: 500">{{formView.error}}</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button onClick="{{saveForm}}" style="min-height: 44px; padding: 10px 16px; border: 0; border-radius: 8px; background: #1F1F1F; color: #FFFFFF; font-size: 15px; font-weight: 600">Save</button>
<button onClick="{{cancelForm}}" style="min-height: 44px; padding: 10px 16px; border: 1px solid #1F1F1F; border-radius: 8px; background: #FFFFFF; color: #1A1A1A; font-size: 15px; font-weight: 500">Cancel</button>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{confirmView.open}}" hint-placeholder-val="{{false}}">
<div style="position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px; box-sizing: border-box; overflow-y: auto; background: rgba(0, 0, 0, 0.55)">
<div role="alertdialog" aria-modal="true" aria-label="Confirm delete" style="width: 100%; max-width: 460px; box-sizing: border-box; background: #FFFFFF; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: 'Archivo', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 700">Delete this record?</h2>
<div>{{confirmView.text}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button onClick="{{doDelete}}" style="min-height: 44px; padding: 10px 16px; border: 0; border-radius: 8px; background: #8A2D00; color: #FFFFFF; font-size: 15px; font-weight: 600">Delete</button>
<button onClick="{{cancelConfirm}}" style="min-height: 44px; padding: 10px 16px; border: 1px solid #1F1F1F; border-radius: 8px; background: #FFFFFF; color: #1A1A1A; font-size: 15px; font-weight: 500">Keep it</button>
</div>
</div>
</div>
</sc-if>


<sc-if value="{{isDash}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
<h1 style="margin: 0; font-family: 'Archivo', 'Segoe UI', sans-serif; font-weight: 700; font-size: 30px">Dashboard</h1>
<div style="font-size: 14px; color: #555555">Sunday, October 4, 2026 · amounts in CAD</div>
</header>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #DCDCDA; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #555555">Cars in stock</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 500">{{count}}</div>
<div style="font-size: 13px; color: #555555">across lots, trailers and auction yards</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #DCDCDA; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #555555">Capital tied up</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 500">{{capital}}</div>
<div style="font-size: 13px; color: #555555">purchase, fees, transport, reconditioning</div>
</div>
<div style="background: #B4470E; color: #FFFFFF; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px">Over 90 days</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 500">{{overCount}} cars</div>
<div style="font-size: 13px">{{overCapital}} locked in aged stock</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #DCDCDA; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #555555">Due this week</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 500">4 items</div>
<div style="font-size: 13px; color: #555555">cheques, lender and bank follow-ups</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<section style="background: #FFFFFF; border: 1px solid #DCDCDA; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
<h2 style="margin: 0; font-family: 'Archivo', 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600">Monthly performance</h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{rangeBtns}}" as="t" hint-placeholder-count="2">
<button onClick="{{t.pick}}" style="min-height: 44px; padding: 8px 14px; border: 1px solid #1F1F1F; border-radius: 999px; font-size: 14px; font-weight: 500; background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{metricBtns}}" as="t" hint-placeholder-count="4">
<button onClick="{{t.pick}}" style="min-height: 44px; padding: 8px 14px; border: 1px solid #1F1F1F; border-radius: 8px; font-size: 14px; font-weight: 500; background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</button>
</sc-for>
</div>
<div style="overflow-x: auto">
<div style="display: flex; align-items: flex-end; gap: 10px; height: 230px; min-width: 320px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
<button onClick="{{b.pick}}" style="flex: 1 1 0; min-width: 44px; height: 230px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: #151515">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{b.valF}}</span>
<span style="display: block; width: 100%; max-width: 72px; height: {{b.h}}; border-radius: 6px 6px 0 0; background: {{b.color}}"></span>
<span style="font-size: 13px; font-weight: {{b.weight}}">{{b.month}}</span>
</button>
</sc-for>
</div>
</div>
<div style="padding: 12px 14px; background: #F5F5F4; border-radius: 8px; font-size: 14px">{{monthDetail}}</div>
<div style="font-size: 13px; color: #555555">Select a month for its full figures.</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #DCDCDA; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Archivo', 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600">Capital by location</h2>
<sc-for list="{{locs}}" as="l" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px"><span>{{l.label}} · {{l.count}}</span><span style="font-family: 'IBM Plex Mono', monospace">{{l.valF}}</span></div>
<div style="height: 12px; background: #EAEAE8; border-radius: 6px"><div style="height: 12px; border-radius: 6px; width: {{l.pct}}; background: #3D62A8"></div></div>
</div>
</sc-for>
<div style="font-size: 13px; color: #555555">Total cost of the cars currently at each place.</div>
</section>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<section style="background: #FFFFFF; border: 1px solid #DCDCDA; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Archivo', 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600">Inventory aging</h2>
<sc-for list="{{buckets}}" as="b" hint-placeholder-count="4">
<button onClick="{{b.pick}}" style="min-height: 44px; display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; text-align: left; font-size: 14px; color: #151515; border-radius: 8px; border: 1px solid {{b.border}}; background: {{b.bg}}">
<span style="display: flex; justify-content: space-between"><span>{{b.label}}</span><span style="font-family: 'IBM Plex Mono', monospace">{{b.count}}</span></span>
<span style="display: block; height: 12px; background: #EAEAE8; border-radius: 6px"><span style="display: block; height: 12px; border-radius: 6px; width: {{b.pct}}; background: {{b.color}}"></span></span>
</button>
</sc-for>
<div style="font-size: 13px; color: #555555">{{bucketTitle}}</div>
<sc-for list="{{bucketCars}}" as="r" hint-placeholder-count="3">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid #EAEAE8">
<div style="flex: 1 1 160px; min-width: 0"><div style="font-weight: 600">{{r.name}}</div><div style="font-size: 13px; color: #555555">{{r.days}} days · {{r.loc}}</div></div>
<button onClick="{{r.open}}" style="min-height: 44px; padding: 8px 12px; border: 1px solid #1F1F1F; border-radius: 8px; background: #FFFFFF; color: #1A1A1A; font-size: 14px; font-weight: 500">Car card</button>
</div>
</sc-for>
<button onClick="{{goInv}}" style="align-self: flex-start; min-height: 44px; padding: 10px 16px; border: 1px solid #1F1F1F; border-radius: 8px; background: #FFFFFF; color: #1A1A1A; font-size: 15px; font-weight: 500">View inventory</button>
</section>

<section style="background: #FFFFFF; border: 1px solid #DCDCDA; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Archivo', 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600">Needs attention</h2>
<sc-for list="{{alerts}}" as="a" hint-placeholder-count="3">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; background: #FBF1E2; border-radius: 8px">
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 180px">
<div style="font-weight: 600">{{a.name}}</div>
<div style="font-size: 14px; color: #5C3A10">{{a.note}}</div>
</div>
<button onClick="{{a.open}}" style="min-height: 44px; padding: 10px 16px; border: 0; border-radius: 8px; background: #121212; color: #FFFFFF; font-size: 14px; font-weight: 500">Open car card</button>
</div>
</sc-for>
</section>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<section style="background: #FFFFFF; border: 1px solid #DCDCDA; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: 'Archivo', 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600">Payments and follow-ups this week</h2>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #EAEAE8"><div><div style="font-weight: 500">Cheque to auction, 2022 Mercedes-Benz GLC 300</div><div style="font-size: 13px; color: #555555">Due Tue, Oct 6</div></div><div style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap">$34,700</div></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #EAEAE8"><div><div style="font-weight: 500">Deposit customer post-dated cheque</div><div style="font-size: 13px; color: #555555">Dated Wed, Oct 7</div></div><div style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap">$8,500</div></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #EAEAE8"><div><div style="font-weight: 500">Floor plan lender, monthly interest</div><div style="font-size: 13px; color: #555555">Due Fri, Oct 9</div></div><div style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap">$1,240</div></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0"><div><div style="font-weight: 500">Bank financing approval, Highlander buyer</div><div style="font-size: 13px; color: #555555">Pending 5 days, follow up with bank</div></div><div style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap">$12,000</div></div>
</section>

<section style="background: #FFFFFF; border: 1px solid #DCDCDA; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: 'Archivo', 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600">September vs August</h2>
<div style="display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px 12px; font-size: 15px">
<div style="font-size: 13px; color: #555555"></div><div style="font-size: 13px; color: #555555; text-align: right">September</div><div style="font-size: 13px; color: #555555; text-align: right">August</div>
